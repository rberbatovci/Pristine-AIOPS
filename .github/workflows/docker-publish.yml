name: Pristine AIOPS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.backend
          push: true
          tags: ghcr.io/rberbatovci/backend:latest

      - name: Build and push syslog producer image
        uses: docker/build-push-action@v5
        with:
          context: ./syslogs/consumer
          file: ./dockerfiles/syslogs.producer
          push: true
          tags: ghcr.io/rberbatovci/syslog-producer:latest

      - name: Build and push syslog consumer image
        uses: docker/build-push-action@v5
        with:
          context: ./syslogs/consumer
          file: ./dockerfiles/syslogs.consumer
          push: true
          tags: ghcr.io/rberbatovci/syslog-consumer:latest

      - name: Build and push syslog signals image
        uses: docker/build-push-action@v5
        with:
          context: ./syslogs/signals
          file: ./dockerfiles/syslogs.signals
          push: true
          tags: ghcr.io/rberbatovci/syslog-signals:latest
