---
- name: Configure Forward Information Base on Cisco IOS device
  hosts: all
  gather_facts: no
  connection: network_cli

  vars:
    ansible_user: "{{ username }}"
    ansible_password: "{{ password }}"
    ansible_network_os: ios
    ansible_connection: network_cli
    ansible_host: "{{ router_ip }}"

  tasks:
    - name: Configure telemetry subscription 107 (Forward Information Base)
      ios_config:
        lines:
          - telemetry ietf subscription 107
          -  encoding encode-kvgpb
          -  filter xpath /fib-ios-xe-oper:fib-oper-data/fib-ni-entry
          -  stream yang-push
          -  update-policy periodic {{ telemetry_period_seconds }}
          -  receiver ip address {{ receiver_ip }} {{ receiver_port }} protocol grpc-tcp
