---
- name: Configure CPU  utilization monitoring on Cisco IOS XE device
  hosts: all
  gather_facts: no
  connection: network_cli

  vars:
    ansible_user: "{{ username }}"
    ansible_password: "{{ password }}"
    ansible_network_os: ios
    ansible_connection: network_cli
    ansible_host: "{{ router_ip }}"

  tasks:
    - name: Configure telemetry subscription 101 (CPU utilization)
      ios_config:
        lines:
          - "telemetry ietf subscription 101"
          - "encoding encode-kvgpb"
          - "filter xpath /process-cpu-ios-xe-oper:cpu-usage/cpu-utilization"
          - "stream yang-push"
          - "update-policy periodic {{ telemetry_period_seconds }}"
          - "receiver ip address {{ receiver_ip }} {{ receiver_port }} protocol grpc-tcp"