  telemetry-xe-producer:
    container_name: TelemetryXEProducer
    image: ghcr.io/rberbato/telemetry-producer:latest
    build:
      context: ./telemetry
      dockerfile: producer/Dockerfile.producer
    environment:
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=telemetry-topic
    ports:
      - "1163:1163"
    env_file:
      - .env
    depends_on:
