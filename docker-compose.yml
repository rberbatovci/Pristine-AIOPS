  trap-producer:
    container_name: TrapProducer
    #image: ghcr.io/rberbato/trap-producer:latest
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.traps-producer
    environment:
      SNMP_AUTH_PASS: ${SNMP_AUTH_PASS}
      SNMP_PRIV_PASS: ${SNMP_PRIV_PASS}
      SNMP_USERNAME: ${SNMP_USERNAME}
      SNMP_ENGINE_ID: ${SNMP_ENGINE_ID}
      SNMP_TRAP_PORT: ${SNMP_TRAP_PORT}
    env_file:
      - .env
    ports:
      - "1161:1161/udp"
    volumes:
      - shared-mibs:/app/traps/producer/mibs
    depends_on:
      kafka:
        condition: service_healthy
    labels:
      - "traefik.enable=false"
    networks:
      - aiops

  trap-consumer:
    container_name: TrapConsumer
    #image: ghcr.io/rberbato/trap-consumer:latest
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.traps-consumer
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
      opensearch-node1:
        condition: service_healthy
    labels:
      - "traefik.enable=false"
    networks:
      - aiops
    restart: unless-stopped

########################################################################################
########################################################################################
# NETFLOW
########################################################################################
########################################################################################

  netflow-producer:
    container_name: NetflowProducer
    #image: ghcr.io/rberbato/netflow-producer:latest
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.netflow-producer
    ports:
      - "1162:1162/udp"
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
    labels:
     - "traefik.enable=false"
    networks:
      - aiops

  netflow-consumer:
    container_name: NetflowConsumer
    #image: ghcr.io/rberbato/netflow-consumer:latest
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.netflow-consumer
    depends_on:
      kafka:
        condition: service_healthy
      opensearch-node1:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "traefik.enable=false"
    networks:
      - aiops

  gobgp:
    container_name: GoBGP
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.gobgp-server
    network_mode: host  
    env_file:
      - .env
    labels:
      - "traefik.enable=false"
    healthcheck:
      test: ["CMD-SHELL", "grpc_health_probe -addr=192.168.1.201:50051"]
      interval: 10s
      timeout: 5s
      retries: 5

  topology-producer:
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.topology-producer
    container_name: TopologyProducer
    environment:
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=topology-topic
      - GOBGP_ADDR=192.168.1.201:50051
    depends_on:
      kafka:
        condition: service_healthy
    labels:
      - "traefik.enable=false"
    networks:
      - aiops

  topology-consumer:
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.topology-consumer
    container_name: TopologyConsumer
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: topology-topic
      KAFKA_GROUP: topology-consumer
      OPENSEARCH_URL: http://opensearch-node1:9200
      OPENSEARCH_INDEX: bgp-topology-events
    depends_on:
      kafka:
        condition: service_healthy
      opensearch-node1:
        condition: service_started
    labels:
      - "traefik.enable=false"
    networks:
      - aiops
      
