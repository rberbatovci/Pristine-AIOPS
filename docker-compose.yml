version: '3.8'

networks:
  aiops:
    driver: bridge
  web:
    driver: bridge
  internal:
    driver: bridge

services:
  ############################################
  # TRAEFIK (reverse proxy)
  ############################################
  traefik:
    image: traefik:v2.10
    container_name: traefik
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Use local CA cert
      - "--tls.certificates[0].certFile=/certs/pristine-aiops.crt"
      - "--tls.certificates[0].keyFile=/certs/pristine-aiops.key"
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./certs:/certs"
      - "./traefik.yml:/etc/traefik/traefik.yml:ro"
    networks:
      - aiops 
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.pristine-aiops.local`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.service=api@internal"

  ############################################
  # FASTAPI BACKEND
  ############################################
  backend:
    #container_name: fastapi
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.backend
    expose:
      - "8000"
    networks:
      - aiops
    depends_on:
      postgresql:
        condition: service_healthy
      opensearch-node1:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - shared-mibs:/app/traps/producer/mibs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`app.pristine-aiops.local`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    extra_hosts:
      - "auth.pristine-aiops.local:host-gateway"

  ############################################
  # FRONTEND (REACT SERVED BY NGINX)
  ############################################
  frontend:
    container_name: react
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.frontend
    depends_on:
      - backend
      - keycloak
      - opensearch-node1
    networks:
      - aiops
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`app.pristine-aiops.local`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  ############################################
  # KEYCLOAK
  ############################################
  keycloak:
    container_name: keycloak
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.keycloak
    image: pristine-aiops-keycloak
    command:
      - start
      - --import-realm
      - --hostname=auth.pristine-aiops.local
      - --http-relative-path=/auth
      - --http-port=8080
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import
    depends_on:
      - postgresql
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: Admin123!
      KC_PROXY: edge
      PROXY_ADDRESS_FORWARDING: "true"
    networks:
      - aiops
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`auth.pristine-aiops.local`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls=true"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"

  ############################################
  # OPENLDAP
  ############################################
  #openldap:
  #  image: osixia/openldap:1.5.0
  #  container_name: openldap
  #  environment:
  #    LDAP_ORGANISATION: "Pristine AIOps"
  #    LDAP_DOMAIN: "pristine.local"
  #    LDAP_ADMIN_PASSWORD: "admin"
  #  networks:
  #    - aiops
  #  restart: unless-stopped


  ############################################
  # PHP LDAP Admin
  ############################################
  #phpldapadmin:
  #  image: osixia/phpldapadmin:0.9.0
  #  container_name: phpldapadmin
  #  environment:
  #    PHPLDAPADMIN_LDAP_HOSTS: openldap
  #    PHPLDAPADMIN_HTTPS: "false"
  #  networks:
  #    - aiops
  #  labels:
  #    - "traefik.enable=true"
  #    - "traefik.http.routers.ldapui.rule=Host(`ldap.pristine-aiops.local`)"
  #    - "traefik.http.routers.ldapui.entrypoints=websecure"
  #    - "traefik.http.routers.ldapui.tls=true"
  #    - "traefik.http.services.ldapui.loadbalancer.server.port=80"

  ############################################
  # FREERADIUS
  ############################################
  freeradius:
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.freeradius
    container_name: FreeRADIUS
    ports:
        - "1812:18120/udp"
        - "1813:18130/udp"
    depends_on:
      - keycloak 
    networks:
      - aiops
    volumes:
      - /etc/ssl/certs/win-server01.pristine-aiops.local.pem:/etc/ssl/certs/win-server01.pristine-aiops.local.pem:ro
    labels:
      - "traefik.enable=false"
    extra_hosts:
      - "WinServer01.pristine-aiops.local:192.168.1.202"
    restart: unless-stopped

  postgresql:
    container_name: PostgreSQL
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.postgresql
    #image: ghcr.io/rberbatovci/postgresql:latest 
    ports:
      - "5432:5432"
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aiops

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - aiops

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 6
    healthcheck:
      test: ["CMD", "bash", "-c", "cub kafka-ready -b localhost:9092 1 20"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - aiops

########################################################################################
########################################################################################
# OPENSEARCH + DASHBOARDS 
########################################################################################
########################################################################################
  opensearch:
    image: opensearchproject/opensearch-dashboards:3.1.0
    container_name: opensearch-dashboards
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch-node1:9200","http://opensearch-node2:9200","http://opensearch-node3:9200"]'
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
    depends_on: 
      - opensearch-node1
      - opensearch-node2
      - opensearch-node3
    ports:
      - "5601:5601"
    networks:
      - aiops
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.opensearch.rule=Host(`opensearch.pristine-aiops.local`)"
    - "traefik.http.routers.opensearch.entrypoints=websecure"
    - "traefik.http.routers.opensearch.tls=true"
    - "traefik.http.services.opensearch.loadbalancer.server.port=5601"

  opensearch-node1:
    image: opensearchproject/opensearch:3.1.0
    container_name: opensearch-node1
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.seed_hosts=opensearch-node1,opensearch-node2,opensearch-node3
      - cluster.initial_master_nodes=opensearch-node1,opensearch-node2,opensearch-node3
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data1:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - aiops

  opensearch-node2:
    image: opensearchproject/opensearch:3.1.0
    container_name: opensearch-node2
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node2
      - discovery.seed_hosts=opensearch-node1,opensearch-node2,opensearch-node3
      - cluster.initial_master_nodes=opensearch-node1,opensearch-node2,opensearch-node3
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data2:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - aiops

  opensearch-node3:
    image: opensearchproject/opensearch:3.1.0
    container_name: opensearch-node3
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node3
      - discovery.seed_hosts=opensearch-node1,opensearch-node2,opensearch-node3
      - cluster.initial_master_nodes=opensearch-node1,opensearch-node2,opensearch-node3
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data3:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - aiops

  redis:
    container_name: Redis
    image: redis:latest
    ports:
      - "6380:6379"
    # Added configuration flags to handle corrupt/truncated tails automatically
    command: >
      redis-server 
      --appendonly yes 
      --aof-load-truncated yes 
      --aof-load-corrupt-tail-max-size 10485760
    volumes:
      - ./data:/data
    networks:
      - aiops 
    # Gives Redis a comfortable 20-second window to flush data to disk before Docker kills it
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  #celery-worker:
  #  container_name: CeleryWorker
  #  image: ghcr.io/rberbato/celery:latest
  #  build:
  #    context: ./signals
  #    dockerfile: Dockerfile.syslogSignals
  #  command: celery -A tasks worker --loglevel=info
  #  depends_on:
  #    - redis
  #    - kafka
  #  networks:
  #    - aiops

  websocket-bridge:
    container_name: WebsocketBridge
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.websocket-bridge
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
    networks:
      - aiops
    ports:
      - "8080:8080"
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.websocket.rule=Host(`app.pristine-aiops.local`) && PathPrefix(`/ws`)"
      - "traefik.http.routers.websocket.entrypoints=websecure"
      - "traefik.http.routers.websocket.tls=true"
      - "traefik.http.services.websocket.loadbalancer.server.port=8080"
      - "traefik.docker.network=pristine-aiops_aiops"

  nmap-scanner:
    container_name: NmapScanner
    #image: ghcr.io/rberbato/nmap-scanner:latest
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.nmap-scanner
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - aiops
    cap_add:
      - NET_RAW
      - NET_ADMIN

########################################################################################
########################################################################################
# ICMP Pings 
########################################################################################
########################################################################################

  icmp-pinger-producer:
    container_name: ICMPPingerProducer
    #image: ghcr.io/rberbato/icmp-pinger:latest
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.icmp-pinger-producer
    env_file:
      - .env 
    depends_on:
      kafka:
        condition: service_healthy
    labels:
      - "traefik.enable=false"
    networks:
      - aiops

  icmp-redis-consumer:
    container_name: ICMPRedisConsumer
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.icmp-redis-consumer 
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - aiops

########################################################################################
########################################################################################
# SYSLOGS 
########################################################################################
########################################################################################

  syslog-producer:
    container_name: SyslogProducer
    #image: ghcr.io/rberbato/syslog-producer:latest
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.syslog-producer
    environment:
      SYSLOG_PORT: ${SYSLOG_PORT:-1160}
    env_file:
      - .env
    ports:
      - "${SYSLOG_PORT}:${SYSLOG_PORT}/udp"
    depends_on:
      kafka:
        condition: service_healthy
    labels:
      - "traefik.enable=false"
    networks:
      - aiops

  syslog-consumer:
    container_name: SyslogConsumer
    #image: ghcr.io/rberbato/syslog-consumer:latest
    build:
       context: .
       dockerfile: ./dockerfiles/Dockerfile.syslog-consumer
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
      opensearch-node1:
        condition: service_healthy
    labels: 
      - "traefik.enable=false"
    networks:
      - aiops
    restart: unless-stopped

  syslog-signals:
    container_name: SyslogSignals
    #image: ghcr.io/rberbato/syslog-signals:latest
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.syslog-signals
    env_file:
      - .env
    depends_on:
      postgresql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch-node1:
        condition: service_healthy
    labels:
      - "traefik.enable=false"
    networks:
      - aiops
    restart: unless-stopped

