version: '3.8'

networks:
  kafka-net:
    driver: bridge

services:
  backend:
    container_name: FastAPI
    image: ghcr.io/rberbato/backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - kafka-net
    entrypoint: ["/app/backend/entrypoint.sh"]

  #frontend:
  #  container_name: ReactJS
  #  build:
  #    context: ./frontend
  #    dockerfile: Docker.frontend
  #  ports:
  #    - "3000:3000"
  #  volumes:
  #    - ./frontend:/app
  #  environment:
  #    - CHOKIDAR_USEPOLLING=true
  #  networks:
  #    - kafka-net

  postgresql:
    image: postgres:15
    container_name: PostgreSQL
    image: ghcr.io/rberbato/postgresql:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: PristineAdmin
      POSTGRES_PASSWORD: PristinePassword
      POSTGRES_DB: fpristine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U PristineAdmin -d fpristine"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kafka-net

  kafka:
    container_name: Kafka
    image: wurstmeister/kafka:latest
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,INTERNAL://kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "telemetry-signals:1:1,cpu-utilization:1:1,memory-statistics:1:1,interface-statistics:1:1,bgp-connections:1:1,isis-statistics:1:1,syslog-events:1:1,trap-events:1:1,netflow-events:1:1,syslog-signals:1:1,trap-signals:1:1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 50
      KAFKA_BROKER_ID: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    ports:
      - "9092:9092"
    depends_on:
      zookeeper:
        condition: service_started
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kafka-net

  zookeeper:
    container_name: Zookeeper
    image: bitnami/zookeeper:latest
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kafka-net

  opensearch:
    image: opensearchproject/opensearch:1.0.1
    container_name: OpenSearch
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./opensearch/config/opensearch.yml:/usr/share/opensearch/config/opensearch.yml
      - ./opensearch/config/jvm.options:/usr/share/opensearch/config/jvm.options
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/"]
      interval: 30s
      timeout: 10s
      retries: 5
    ports:
      - 9200:9200
      - 9600:9600
    networks:
      - kafka-net

  opensearch-init:
    image: ghcr.io/rberbato/opensearch-init:latest
    build:
      context: ./opensearch
      dockerfile: Dockerfile.OpenSearch
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - kafka-net

  redis:
    container_name: Redis
    image: ghcr.io/rberbato/redis:latest
    image: redis:latest
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - kafka-net

  celery-worker:
    container_name: CeleryWorker
    image: ghcr.io/rberbato/celery:latest
    build:
      context: ./signals
      dockerfile: Dockerfile.syslogSignals
    command: celery -A tasks worker --loglevel=info
    depends_on:
      - redis
      - kafka
    networks:
      - kafka-net

  syslog-producer:
    container_name: SyslogProducer
    image: ghcr.io/rberbato/syslog-producer:latest
    build:
      context: ./syslogs
      dockerfile: Dockerfile.producer
    environment:
      SYSLOG_PORT: ${SYSLOG_PORT:-1160}
      DATA_FLUSH_INTERVAL: ${DATA_FLUSH_INTERVAL:-1}
      DATA_FLUSH_SIZE: ${DATA_FLUSH_SIZE:-100}
    ports:
      - "1160:1160/udp"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka-net

  syslog-consumer:
    container_name: SyslogConsumer
    image: ghcr.io/rberbato/syslog-consumer:latest
    build:
      context: ./syslogs/consumer
      dockerfile: Dockerfile.consumer
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_EVENTS_TOPIC: syslog-events
      KAFKA_SIGNALS_TOPIC: syslog-signals
      DATA_FLUSH_INTERVAL: ${DATA_FLUSH_INTERVAL:-1}
      DATA_FLUSH_SIZE: ${DATA_FLUSH_SIZE:-100}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka-net
    restart: unless-stopped

  syslog-signals:
    container_name: SyslogSignals
    image: ghcr.io/rberbato/syslog-signals:latest
    build:
      context: ./syslogs/signals
      dockerfile: Dockerfile.signals
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_SIGNALS_TOPIC: syslog-signals
      DATA_FLUSH_INTERVAL: ${DATA_FLUSH_INTERVAL:-1}
      DATA_FLUSH_SIZE: ${DATA_FLUSH_SIZE:-100}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka-net
    restart: unless-stopped

  trap-signals:
    container_name: TrapSignals
    image: ghcr.io/rberbato/trap-signals:latest
    build:
      context: ./traps/signals
      dockerfile: Dockerfile.signals
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_SIGNALS_TOPIC: trap-signals
      DATA_FLUSH_INTERVAL: ${DATA_FLUSH_INTERVAL:-1}
      DATA_FLUSH_SIZE: ${DATA_FLUSH_SIZE:-100}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka-net
    restart: unless-stopped

  trap-producer:
    container_name: TrapProducer
    image: ghcr.io/rberbato/trap-producer:latest
    build:
      context: ./traps
      dockerfile: Dockerfile.producer
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_EVENTS_TOPIC: trap-events
      KAFKA_SIGNALS_TOPIC: trap-signals
      SNMP_AUTH_PASS: ${SNMP_AUTH_PASS}
      SNMP_PRIV_PASS: ${SNMP_PRIV_PASS}
      SNMP_USERNAME: ${SNMP_USERNAME}
      SNMP_ENGINE_ID: ${SNMP_ENGINE_ID}
      SNMP_TRAP_PORT: ${SNMP_TRAP_PORT}
      DATA_FLUSH_INTERVAL: ${DATA_FLUSH_INTERVAL:-1}
      DATA_FLUSH_SIZE: ${DATA_FLUSH_SIZE:-100}
    ports:
      - "1161:1161/udp"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka-net

  trap-consumer:
    container_name: TrapConsumer
    image: ghcr.io/rberbato/trap-consumer:latest
    build:
      context: ./traps/consumer
      dockerfile: Dockerfile.consumer
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_EVENTS_TOPIC: trap-events
      KAFKA_SIGNALS_TOPIC: trap-signals
      DATA_FLUSH_INTERVAL: ${DATA_FLUSH_INTERVAL:-1}
      DATA_FLUSH_SIZE: ${DATA_FLUSH_SIZE:-100}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka-net
    restart: unless-stopped

  #netflow-producer:
  #  container_name: NetflowProducer
  #  image: ghcr.io/rberbato/netflow-producer:latest
  #  build:
  #    context: ./netflow
