######################################################################
# FreeRADIUS 3.2.x — Recommended Full Configuration
######################################################################

prefix = /usr
exec_prefix = ${prefix}
sysconfdir = /etc
localstatedir = /var
sbindir = ${exec_prefix}/sbin
logdir = /var/log/radius
raddbdir = /etc/freeradius/3.0
radacctdir = /var/log/radius/radacct

name = freeradius
confdir = ${raddbdir}
modconfdir = ${confdir}/mods-config
certdir = ${confdir}/certs
cadir = ${confdir}/certs

run_dir = /var/run/radiusd
db_dir = /var/lib/radiusd

max_request_time = 30
cleanup_delay = 5
max_requests = 10240

reject_delay = 1
status_clients = ${confdir}/statusclients.conf

######################################################################
# Logging – Docker optimized
######################################################################
log {
    destination = stdout
    colourise = yes
    stripped_names = no
    auth = yes
    auth_badpass = yes
    auth_goodpass = yes
    auth_detail = yes
    # Add these for LDAP debugging
    ldap = yes
    ldap_dbg = yes
}

######################################################################
# Policies
######################################################################
policy {
    $INCLUDE policy.d/
}

######################################################################
# Threading
######################################################################
thread pool {
    start_servers = 5
    max_servers   = 32
    min_spare_servers = 3
    max_spare_servers = 10
    max_requests_per_server = 0
}

######################################################################
# Core Modules Section — REQUIRED
######################################################################
modules {
    $INCLUDE mods-enabled/
}

######################################################################
# Virtual Servers
######################################################################
# Load ALL sites from sites-enabled
$INCLUDE sites-enabled/

######################################################################
# Clients
######################################################################
$INCLUDE clients.conf

######################################################################
# Security
######################################################################
security {
    allow_core_dumps = no
    max_attributes = 200
    reject_delay = 1
}

######################################################################
# Accounting
######################################################################
listen {
    type = acct
    ipaddr = *
    port = 1813
}

######################################################################
# Authentication
######################################################################
listen {
    type = auth
    ipaddr = *
    port = 1812
}

